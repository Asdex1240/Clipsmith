name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and comments
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: swift format lint --strict --configuration .swift-format -r Sources Tests
      - name: Reject comments in the code
        run: |
          if grep -rnE '^\s*//' Sources Tests | grep -v MARK; then
            echo "::error::Comments are not allowed in the code (CODE_RULES.md, section 9)"
            exit 1
          fi

  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
